# =============================================================================
# docker-compose.prod.yml — PRODUCTION
# Builds the static site and serves it with nginx.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml down
#
# Open: http://localhost (port 80), or put it behind a reverse proxy
# =============================================================================

services:
  jekyll-prod:
    build:
      context: .
      target:  prod         # "prod" stage of the Dockerfile (nginx)
    container_name: infops-prod
    ports:
      - "80:80"
    environment:
      - TZ=Europe/Paris
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:     ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout:  5s
      retries:  3

  # ── Optional: TLS certificates with Certbot ───────────────────────────────
