name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 4 * * 1"   # weekly, Monday morning

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (JavaScript, Actions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # generated / third-party code (gpSP build, minified libraries)
          config: |
            paths-ignore:
              - assets/vendor
              - _site

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
