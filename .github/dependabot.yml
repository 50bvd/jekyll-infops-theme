# Keeps the GitHub Actions and the Docker base images up to date (weekly,
# grouped into one pull request per ecosystem).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # A new major Ruby (e.g. 4.x) needs the Jekyll build tested in Docker,
    # which CI does not do: upgrade it by hand. Minor / patch updates and the
    # web server images still come automatically.
    ignore:
      - dependency-name: ruby
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
