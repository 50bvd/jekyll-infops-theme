# =============================================================================
# docker-compose.yml — DEVELOPMENT
# Runs Jekyll with LiveReload, sources mounted as a volume.
#
# Usage:
#   docker compose up          → start
#   docker compose up --build  → rebuild after a Gemfile/Dockerfile change
#   docker compose down        → stop
#
# Open: http://localhost:4000
# =============================================================================

services:
  jekyll:
    build:
      context: .
      target:  dev          # "dev" stage of the Dockerfile
    container_name: infops-dev
    volumes:
      # Live sources: changes are picked up immediately
      - .:/site
      # Gem cache, kept apart from the host
      - gem_cache:/usr/local/bundle
      # Jekyll cache for incremental builds
      - jekyll_cache:/site/.jekyll-cache
    ports:
      # Local only: jekyll serve (WEBrick) is a dev server, never expose it publicly
      - "127.0.0.1:4000:4000"    # Site
      - "127.0.0.1:35729:35729"  # LiveReload WebSocket
    environment:
      - JEKYLL_ENV=development
      - TZ=Europe/Paris
    restart: unless-stopped
    # Optional: resource limits
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M

volumes:
  gem_cache:
  jekyll_cache:
