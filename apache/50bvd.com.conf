# =============================================================================
# apache/50bvd.com.conf — PRODUCTION vhost for https://50bvd.com
#
# Install (Debian/Ubuntu):
#   sudo a2enmod headers deflate expires rewrite ssl http2
#   sudo mkdir -p /etc/apache2/infops && sudo cp apache/*.conf /etc/apache2/infops/
#   sudo cp apache/50bvd.com.conf /etc/apache2/sites-available/
#   sudo a2ensite 50bvd.com && sudo apachectl configtest && sudo systemctl reload apache2
# Certificates: see DEPLOY.md (certbot --webroot, before enabling this file)
# (RHEL/Alma: /etc/httpd/conf.d/ instead of sites-available)
# =============================================================================
Define INFOPS_SITE_ROOT      /var/www/50bvd.com
Define INFOPS_CONF_DIR  /etc/apache2/infops

ServerTokens Prod
ServerSignature Off
TraceEnable Off

# HTTP → HTTPS (keeps /.well-known for certbot)
<VirtualHost *:80>
    ServerName 50bvd.com
    ServerAlias www.50bvd.com
    # certbot --webroot uses this folder for renewals (see DEPLOY.md)
    DocumentRoot /var/www/html
    <Directory /var/www/html/.well-known/acme-challenge>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://50bvd.com%{REQUEST_URI} [R=301,L]
</VirtualHost>

# www → apex
<VirtualHost *:443>
    ServerName www.50bvd.com
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/50bvd.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/50bvd.com/privkey.pem
    Redirect permanent / https://50bvd.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName 50bvd.com
    DocumentRoot ${INFOPS_SITE_ROOT}

    Protocols h2 http/1.1
    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/50bvd.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/50bvd.com/privkey.pem
    SSLProtocol           -all +TLSv1.2 +TLSv1.3
    SSLHonorCipherOrder   off

    Include ${INFOPS_CONF_DIR}/site-common.conf

    # HTTPS only from here on (1 year). Add "; preload" once you are sure.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"

    ErrorLog  ${APACHE_LOG_DIR}/50bvd.com-error.log
    CustomLog ${APACHE_LOG_DIR}/50bvd.com-access.log combined
</VirtualHost>
