# =============================================================================
# apache/site-common.conf — static Jekyll site rules (included in a vhost).
# Modules: mod_headers, mod_deflate, mod_expires, mod_rewrite (optional)
# =============================================================================
Include ${INFOPS_CONF_DIR}/security-headers.conf

<Directory "${INFOPS_SITE_ROOT}">
    Options -Indexes -Includes -ExecCGI +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.html
</Directory>

# Hidden files (.git, .env, .htaccess…) are never served
<LocationMatch "/\.(?!well-known/)">
    Require all denied
</LocationMatch>

# Jekyll pretty URLs: /about → /about.html when it exists
<IfModule mod_rewrite.c>
    RewriteEngine On
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-d
    RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI}.html -f
    RewriteRule ^(.+?)/?$ $1.html [L]
</IfModule>

ErrorDocument 404 /404.html

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/javascript application/javascript application/json application/xml application/rss+xml application/atom+xml image/svg+xml
</IfModule>

# Assets are not fingerprinted → moderate cache; feeds/search index → short
<IfModule mod_expires.c>
    ExpiresActive On
    ExpiresDefault                          "access plus 1 hour"
    ExpiresByType text/html                 "access plus 0 seconds"
    ExpiresByType text/css                  "access plus 30 days"
    ExpiresByType text/javascript           "access plus 30 days"
    ExpiresByType application/javascript    "access plus 30 days"
    ExpiresByType image/svg+xml             "access plus 30 days"
    ExpiresByType image/png                 "access plus 30 days"
    ExpiresByType image/jpeg                "access plus 30 days"
    ExpiresByType image/webp                "access plus 30 days"
    ExpiresByType font/woff2                "access plus 30 days"
    ExpiresByType application/xml           "access plus 1 hour"
    ExpiresByType application/json          "access plus 1 hour"
</IfModule>
