# =============================================================================
# apache/preprod-httpd.conf — site config for the PREPROD container (httpd:2.4)
# Appended to the image's httpd.conf by the Dockerfile "preprod" target.
# =============================================================================
<IfModule !headers_module>
    LoadModule headers_module modules/mod_headers.so
</IfModule>
<IfModule !deflate_module>
    LoadModule deflate_module modules/mod_deflate.so
</IfModule>
<IfModule !expires_module>
    LoadModule expires_module modules/mod_expires.so
</IfModule>
<IfModule !rewrite_module>
    LoadModule rewrite_module modules/mod_rewrite.so
</IfModule>

Define INFOPS_SITE_ROOT      /usr/local/apache2/htdocs
Define INFOPS_CONF_DIR  /usr/local/apache2/conf/infops

ServerName preprod.local
ServerTokens Prod
ServerSignature Off
TraceEnable Off

DocumentRoot ${INFOPS_SITE_ROOT}
Include ${INFOPS_CONF_DIR}/site-common.conf

# Preprod must never be indexed
Header always set X-Robots-Tag "noindex, nofollow"
