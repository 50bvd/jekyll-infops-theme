# =============================================================================
# apache/security-headers.conf — shared by the production vhost and the preprod
# container. Requires mod_headers.
# =============================================================================
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options    "nosniff"
    Header always set X-Frame-Options           "SAMEORIGIN"
    Header always set Referrer-Policy           "strict-origin-when-cross-origin"
    Header always set Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # same-origin-allow-popups: keeps the isolation but lets login popups (Disqus…) report back
    Header always set Cross-Origin-Opener-Policy "same-origin-allow-popups"
    Header always set X-XSS-Protection          "0"
    # Content-Security-Policy: the full policy is generated per page by the theme
    # (_includes/csp.html, <meta> tag) from _config.yml, so it always matches the
    # features you enable (GoatCounter, Disqus, Mermaid…). Only the directives a
    # <meta> tag cannot carry are sent here — two full policies would stack up and
    # the stricter one would silently block legitimate resources.
    # script-src here is deliberately broad: the <meta> policy is the strict one (the
    # browser enforces both). Having our own script-src in the header matters because
    # some antivirus products (Kaspersky…) rewrite the header to inject their script:
    # without one, they add "script-src 'self' <their host>", which blocks WebAssembly
    # (the terminal's GBA emulator) and everything the meta policy allows.
    Header always set Content-Security-Policy "script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https:; frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
    Header always unset X-Powered-By
</IfModule>
