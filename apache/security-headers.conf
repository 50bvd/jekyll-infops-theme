# =============================================================================
# apache/security-headers.conf — shared by the production vhost and the preprod
# container. Requires mod_headers.
# =============================================================================
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options    "nosniff"
    Header always set X-Frame-Options           "SAMEORIGIN"
    Header always set Referrer-Policy           "strict-origin-when-cross-origin"
    Header always set Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set X-XSS-Protection          "0"
    # Content-Security-Policy — keep in sync with _includes/csp.html
    # (add your analytics host to script-src / connect-src if you enable one)
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://utteranc.es; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https:; connect-src 'self'; frame-src 'self' https://utteranc.es; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    Header always unset X-Powered-By
</IfModule>
