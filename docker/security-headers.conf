# =============================================================================
# security-headers.conf — included in every `location` block of nginx.conf.
#
# Why a snippet? In nginx, an `add_header` declared inside a `location`
# DISCARDS every `add_header` inherited from the `server` block. Without this
# snippet, CSS/JS/images (which set their own Cache-Control) were served
# without any security header.
# =============================================================================

add_header X-Frame-Options           "SAMEORIGIN" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# X-XSS-Protection is obsolete and can introduce vulnerabilities: explicitly disabled.
add_header X-XSS-Protection          "0" always;

# HSTS — enable ONLY if the site is served over HTTPS (behind a TLS reverse proxy).
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content Security Policy
#  - 'unsafe-inline' (script) is still required by the theme's anti-flash script and
#    the inline analytics snippets.
#  - Self-hosted Umami: add your Umami domain to script-src and connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://utteranc.es https://gc.zgo.at https://www.googletagmanager.com https://plausible.io; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https:; frame-src https://utteranc.es; connect-src 'self' https://*.goatcounter.com https://plausible.io https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;
