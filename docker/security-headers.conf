# =============================================================================
# security-headers.conf — included in every `location` block of nginx.conf.
#
# Why a snippet? In nginx, an `add_header` declared inside a `location`
# DISCARDS every `add_header` inherited from the `server` block. Without this
# snippet, CSS/JS/images (which set their own Cache-Control) were served
# without any security header.
# =============================================================================

add_header X-Frame-Options           "SAMEORIGIN" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# same-origin-allow-popups: keeps the isolation but lets login popups (Disqus…) report back
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# X-XSS-Protection is obsolete and can introduce vulnerabilities: explicitly disabled.
add_header X-XSS-Protection          "0" always;

# HSTS — enable ONLY if the site is served over HTTPS (behind a TLS reverse proxy).
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Content-Security-Policy: the full policy is generated per page by the theme
# (_includes/csp.html, <meta> tag) from _config.yml, so it always matches the
# enabled features. Only the directives a <meta> tag cannot carry are sent here —
# two full policies would stack up and the stricter one would block legitimate resources.
# script-src is broad on purpose (the <meta> policy is the strict one, both apply): some
# antivirus products rewrite this header to inject their script and, when it has no
# script-src, add a restrictive one that blocks WebAssembly (GBA emulator).
# The value comes from the map at the top of nginx.conf: empty (no header) for
# the GBA emulator's compile worker, see there.
add_header Content-Security-Policy $infops_csp always;
