server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Do not disclose the nginx version
    server_tokens off;
    charset utf-8;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript
               application/json application/xml application/rss+xml
               application/atom+xml image/svg+xml application/wasm;
    gzip_min_length 256;

    # Security headers (server level — inherited by locations
    # that do not declare their own add_header)
    include /etc/nginx/snippets/security-headers.conf;

    # No hidden files (.git, .env, .htaccess…)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Cache assets statiques
    location ~* \.(css|js|wasm|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp|avif)$ {
        expires     30d;
        add_header  Cache-Control "public";
        include     /etc/nginx/snippets/security-headers.conf;
        access_log  off;
        try_files   $uri =404;
    }

    # Feed, sitemap & search index: short cache
    location ~* \.(xml|json)$ {
        expires     1h;
        add_header  Cache-Control "public, must-revalidate";
        include     /etc/nginx/snippets/security-headers.conf;
        try_files   $uri =404;
    }

    # Fallback Jekyll — pages sans extension
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # 404 custom Jekyll
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
