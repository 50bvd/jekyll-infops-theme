<button type="button"
  id="theme-toggle-btn"
  class="theme-toggle"
  aria-label="Switch theme"
  title="Toggle dark / light mode">
  {% comment %} One SVG that morphs sun ⇄ moon, driven by html[data-theme] (CSS only) {% endcomment %}
  <svg class="sun-moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
    <mask id="sun-moon-mask">
      <rect x="0" y="0" width="24" height="24" fill="#fff"/>
      <circle class="sun-moon-shadow" cx="24" cy="10" r="6" fill="#000"/>
    </mask>
    <circle class="sun-moon-core" cx="12" cy="12" r="6" mask="url(#sun-moon-mask)" fill="currentColor"/>
    <g class="sun-moon-rays" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
      <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
    </g>
  </svg>
</button>
