# _data/theme.yml
# =============================================================================
# Visual customisation — jekyll-infops-theme
# Change the look from THIS FILE, without touching the SCSS.
# Leave a value empty ("") to keep the theme default (shown in the comments).
# Only the values you set are added to the pages.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │  USEFUL TOOLS                                                           │
# │  Fonts    : https://fonts.google.com                                    │
# │  Colours  : https://coolors.co  |  https://palettemaker.com             │
# │  Gradients: https://cssgradient.io                                      │
# │  Contrast : https://webaim.org/resources/contrastchecker                │
# └─────────────────────────────────────────────────────────────────────────┘
# =============================================================================

# ---------------------------------------------------------------------------
# FONTS
# Empty = the self-hosted defaults: Inter (sans) + JetBrains Mono (mono).
# Any other font is loaded from Google Fonts: use its exact name there.
# ---------------------------------------------------------------------------
fonts:
  sans: ""   # e.g. "Plus Jakarta Sans" | "Outfit" | "Geist" | "DM Sans"
  mono: ""   # e.g. "Fira Code" | "Source Code Pro" | "Cascadia Code"

# ---------------------------------------------------------------------------
# COLOURS — dark theme (the light theme keeps its own contrast-checked palette)
# Hex (#rrggbb) or rgb(r,g,b). The hover colour is derived from accent_blue.
#
# ── READY-MADE PALETTES — copy one block under `colors:` ────────────────────
#
# ── Cyberpunk (purple + pink) ─────
# accent_blue:   "#b57bee"
# accent_green:  "#f72585"
# accent_purple: "#7209b7"
# accent_red:    "#f72585"
# accent_yellow: "#ffd60a"
# bg_primary:    "#0a0a0f"
# bg_secondary:  "#13131a"
# bg_tertiary:   "#1c1c2e"
#
# ── Ocean (deep blue) ─────────────
# accent_blue:   "#00b4d8"
# accent_green:  "#48cae4"
# accent_purple: "#0077b6"
# accent_red:    "#ef233c"
# accent_yellow: "#f4a261"
# bg_primary:    "#03045e"
# bg_secondary:  "#023e8a"
# bg_tertiary:   "#0077b6"
#
# ── Forest (dark green) ───────────
# accent_blue:   "#52b788"
# accent_green:  "#95d5b2"
# accent_purple: "#b7e4c7"
# accent_red:    "#e63946"
# accent_yellow: "#ffd166"
# bg_primary:    "#081c15"
# bg_secondary:  "#1b4332"
# bg_tertiary:   "#2d6a4f"
#
# ── Solarized Dark ────────────────
# accent_blue:   "#268bd2"
# accent_green:  "#859900"
# accent_purple: "#6c71c4"
# accent_red:    "#dc322f"
# accent_yellow: "#b58900"
# bg_primary:    "#002b36"
# bg_secondary:  "#073642"
# bg_tertiary:   "#586e75"
# ---------------------------------------------------------------------------
colors:
  # Accents
  accent_blue:   ""   # default #58a6ff — links, buttons, main highlights
  accent_green:  ""   # default #56d364 — success, tips, "online" status
  accent_purple: ""   # default #a5a5ff — secondary accent
  accent_red:    ""   # default #f85149 — errors, danger
  accent_yellow: ""   # default #e3b341 — warnings

  # Backgrounds
  bg_primary:    ""   # default #0d1117 — page
  bg_secondary:  ""   # default #161b22 — cards, header, sidebar
  bg_tertiary:   ""   # default #21262d — inputs, hover, code

# ---------------------------------------------------------------------------
# CODE BLOCKS
# ---------------------------------------------------------------------------
code:
  # Prism.js syntax colours (self-hosted in assets/vendor/prism/themes/):
  #   prism-tomorrow (default) | prism-okaidia | prism-solarizedlight
  #   prism-twilight | prism-coy | prism-dark | prism-funky | prism
  theme: "prism-tomorrow"

  header_bg:  ""   # code block header background (dark theme)
  lang_color: ""   # language label colour (dark theme)

# ---------------------------------------------------------------------------
# LAYOUT
# ---------------------------------------------------------------------------
layout:
  max_width:     ""   # default 1400 — max width of the site in px (1200–1600)
  border_radius: ""   # default 12 — card corner radius in px (0 = square)

# ---------------------------------------------------------------------------
# HERO SECTION (home page)
# ---------------------------------------------------------------------------
hero:
  title_gradient: ""   # e.g. "linear-gradient(135deg, #58a6ff 0%, #a5a5ff 50%, #56d364 100%)"
  min_height:     ""   # default: full screen. A number = height in % of the screen (e.g. 70)

# ---------------------------------------------------------------------------
# SIDEBAR
# ---------------------------------------------------------------------------
sidebar:
  width: ""   # default 320 — sidebar width in px (260–400)

# ---------------------------------------------------------------------------
# POSTS
# ---------------------------------------------------------------------------
posts:
  reading_speed: 200   # words per minute, for the "x min read" estimate
  excerpt_words: 30    # length of the excerpt on post cards (words)
  card_accent:   ""    # colour of the post cards' left bar (default: the main gradient)
