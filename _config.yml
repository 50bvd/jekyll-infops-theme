# =============================================================================
# jekyll-infops-theme — Configuration
# https://github.com/50bvd/jekyll-infops-theme
# =============================================================================

title:       "jekyll-infops-theme"
tagline:     "DevOps · SysOps · Infrastructure"
description: "A modern Jekyll theme for DevOps and SysOps engineers."
baseurl:     "/jekyll-infops-theme"   # GitHub Pages project site (personal server: see _config.perso.yml)
url:         "https://50bvd.github.io"
lang:        "en"
timezone:    "Europe/Paris"

author:
  name:     "50bvd"
  email:    ""
  bio:      "Infrastructure engineer & open-source enthusiast."
  avatar:   "/assets/images/avatar.jpg"
  github:   "50bvd"
  twitter:  ""
  linkedin: ""
  mastodon: ""

# ---------------------------------------------------------------------------
# ANALYTICS — load ONLY in production (JEKYLL_ENV=production)
# ---------------------------------------------------------------------------
analytics:
  goatcounter_code:    ""
  google_analytics_id: ""
  plausible_domain:    ""
  umami_website_id:    ""
  umami_src:           ""

# ---------------------------------------------------------------------------
# COMMENTS
# ---------------------------------------------------------------------------
comments:
  provider:         "utterances"
  utterances_repo:  "50bvd/jekyll-infops-theme"
  utterances_theme: "github-dark"
  disqus_shortname: ""

# ---------------------------------------------------------------------------
# SEARCH
# ---------------------------------------------------------------------------
search:
  enabled:  true
  provider: "local"

# ---------------------------------------------------------------------------
# THEME
# ---------------------------------------------------------------------------
theme_config:
  default_theme: "dark"   # dark | light | auto (follows the OS setting)

  show_hero:     true
  show_terminal: true
  terminal_user: "user@infops"   # label shown in the terminal title bar

  # ── Hero (home page welcome block) ───────────────────────────────────────
  hero:
    title:          ""        # text override (default: site.title)
    subtitle:       ""        # text override (default: tagline) — false to hide
    logo:           ""        # image replacing the title text, e.g. "/assets/images/logo.svg"
    logo_dark:      ""        # optional variant used in dark mode
    logo_alt:       ""        # alt text (default: site.title)
    logo_max_width: 420       # px
    include:        ""        # fully custom block: file name in _includes/ (e.g. "my-hero.html")

  # ── Terminal behaviour ───────────────────────────────────────────────────
  terminal:
    mobile:            "button"   # phones: button (opens on tap) | show | hide
    launcher_label:    "Open terminal"
    autofocus:         true       # desktop only — never on touch devices
    persist_history:   true       # ↑/↓ history kept for the browser tab (sessionStorage)
    welcome_command:   ""         # command run after boot, e.g. "help"
    disabled_commands: []         # e.g. [pacman, matrix]
    max_input:         256        # max characters per command
    max_lines:         500        # output lines kept in the DOM

  # ── Terminal boot — neofetch banner shown when the terminal starts ───────
  # Leave a value empty ("") to hide its line.
  terminal_boot:
    user:  "YOUR_USER"        # e.g. loup
    host:  "YOUR_HOST"        # e.g. infops
    os:    "YOUR_OS"          # e.g. Jekyll 4.4 · AlmaLinux 10
    shell: "YOUR_SHELL"       # e.g. bash 5.2
    role:  "YOUR_ROLE"        # e.g. SysOps · Infrastructure
    line1: "YOUR_LINE1"       # e.g. Org: ACME
    line2: "YOUR_LINE2"       # e.g. Stack: Proxmox · Docker
    motd:  "Type /help for commands"        # message under the banner
    image: ""                 # logo image shown instead of the ASCII art, e.g. "/assets/images/logo.png"
    image_alt: ""

    # ASCII art shown left of the banner (up to ~9 lines, ~32 characters wide)
    # Leave empty for the default logo. Generator: https://patorjk.com/software/taag/
    ascii: |
      YOUR_ASCII_LINE_1
      YOUR_ASCII_LINE_2
      YOUR_ASCII_LINE_3
      YOUR_ASCII_LINE_4
      YOUR_ASCII_LINE_5
      YOUR_ASCII_LINE_6
      YOUR_ASCII_LINE_7
      YOUR_ASCII_LINE_8
      YOUR_ASCII_LINE_9

  # ── Sidebar ────────────────────────────────────────────────────────────
  show_stats:         true
  show_system_status: true
  show_recent_posts:  true
  show_categories:    true
  show_tags:          true
  recent_posts_count: 5

  # ── Post options ───────────────────────────────────────────────────────
  reading_time:          true
  word_count:            true
  show_toc:              true
  toc_min_headings:      2
  code_copy_button:      true
  show_share_buttons:    true
  show_post_nav:         true
  show_related_posts:    true
  show_reading_progress: true
  show_screenshot_placeholders: false   # true: dashed boxes for screenshots not added yet (preprod)

  # ── Article covers ─────────────────────────────────────────────────────
  # Front matter `image:` (+ `image_light:`) = your own cover. Without it, a cover is
  # generated from the title + tags (dark/light SVG, PNG for social cards if
  # rsvg-convert is installed — it is in the Docker image).
  covers:
    enabled:       true
    show_on_cards: true
    show_on_posts: true
    png:           true

  # ── Canvas background ──────────────────────────────────────────────────
  canvas:
    enabled:         true
    particle_count:  80
    max_distance:    130
    cursor_distance: 160

  # ── Navigation ─────────────────────────────────────────────────────────
  navigation:
    - title: "Home"
      url:   "/"
      icon:  "fas fa-home"
    - title: "Archives"
      url:   "/archives/"
      icon:  "fas fa-archive"
    - title: "Tags"
      url:   "/tags/"
      icon:  "fas fa-tags"
    - title: "About"
      url:   "/about/"
      icon:  "fas fa-user"
    - title: "GitHub"
      url:   "https://github.com/50bvd/jekyll-infops-theme"
      icon:  "fab fa-github"
      external: true

  footer:
    show_rss:        true
    show_sitemap:    true
    show_built_with: true
    custom_text:     ""

  seo:
    image: "/assets/images/og-default.png"
    noindex: false   # true = ask search engines not to index (used by the preprod build)

  # ── Security ───────────────────────────────────────────────────────────
  security:
    csp: true                 # Content-Security-Policy <meta> (production builds only)
    upgrade_insecure_requests: true   # set false if the site is served over plain HTTP
    csp_extra:                # extra allowed hosts, e.g. script: ["https://example.com"]
      script:  []
      style:   []
      connect: []
      img:     []
      frame:   []
      font:    []

# ---------------------------------------------------------------------------
# SEO
# ---------------------------------------------------------------------------
twitter:
  username: ""
  card:     "summary_large_image"

# ---------------------------------------------------------------------------
# JEKYLL
# ---------------------------------------------------------------------------
markdown:    kramdown
highlighter: rouge
permalink:   /:year/:month/:day/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

paginate:      8
paginate_path: "/page:num/"

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-relative-links

sass:
  style:     compressed
  sass_dir:  _sass
  sourcemap: development   # no .css.map in production builds

liquid:
  error_mode:       warn
  strict_filters:   false
  strict_variables: false

defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: "post", author: "50bvd", comments: true, toc: true }
  - scope: { path: "", type: "pages" }
    values: { layout: "default" }

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - .gitignore
  - .github/
  - node_modules/
  - package.json
  - package-lock.json
  - .sass-cache/
  - .jekyll-cache/
  - vendor/
  - BAK/
  - categories/
  - "*.sh"
  - "*.bak"
  - "*.txt"
  - CHANGELOG.md
  - CONTRIBUTING.md
  - jekyll-infops-theme.gemspec
  # Deployment files — never published with the site
  - Dockerfile
  - docker/
  - "docker-compose*.yml"
  - apache/
  - scripts/
  - DEPLOY.md
  - SCREENSHOTS.md
  - _posts/README.md

include:
  - .htaccess
