# =============================================================================
# _config.perso.yml — 50bvd.com (home server)
#
# _config.yml stays set up for the theme's GitHub Pages demo; the Docker builds
# used by scripts/deploy.sh layer this file on top:
#   jekyll build --config _config.yml,_config.perso.yml
# Nested keys are merged: only what differs from _config.yml needs to be here.
# =============================================================================

title:       "50bvd IT Guides"
tagline:     "SysOps · Infrastructure · Homelab"
description: "Technical blog — systems administration, infrastructure, homelab and open source."
url:         "https://50bvd.com"
baseurl:     ""               # served from the domain root
lang:        "en"

author:
  name:   "50bvd"
  bio:    "Systems and infrastructure administrator. Into homelabs, Linux, Docker and reverse engineering."
  avatar: "/assets/images/avatar.jpg"
  github: "50bvd"

# Google Search Console ownership (jekyll-seo-tag outputs the meta tag).
# Put the code from your old layout here:
#   grep -r google-site-verification /root/50bvd-site/_layouts /root/50bvd-site/_includes
webmaster_verifications:
  google: "fNnk7xUW4fqMha3TuzOvvHOzKUp0rqgXSydLfdxkFzQ"

analytics:
  goatcounter_code: "50bvd"

comments:
  provider:         "disqus"
  disqus_shortname: "50bvd"

theme_config:
  default_theme: "dark"

  # GBA emulator: ROM list served from the server (scripts/gba-library.sh,
  # folder /opt/50bvd-files/roms mounted at /assets/roms/ by docker-compose)
  gba:
    library: "/assets/roms/roms.json"
  terminal_user: "50bvd@homelab"

  terminal_boot:
    user:  "50bvd"
    host:  "macpro"
    os:    "Debian 13 · Proxmox 8.4"
    shell: "bash 5.2"
    role:  "SysOps · Infrastructure"
    line1: "Stack: Proxmox · Docker · HAProxy"
    line2: "Net:   FortiGate · OpenBSD · ZFS"
    motd:  "Welcome. Type /help for commands."
    ascii: |
      ███████╗ ██████╗ ██████╗ ██╗   ██╗██████╗
      ██╔════╝██╔═████╗██╔══██╗██║   ██║██╔══██╗
      ███████╗██║██╔██║██████╔╝██║   ██║██║  ██║
      ╚════██║████╔╝██║██╔══██╗╚██╗ ██╔╝██║  ██║
      ███████║╚██████╔╝██████╔╝ ╚████╔╝ ██████╔╝
      ╚══════╝ ╚═════╝ ╚═════╝   ╚═══╝  ╚═════╝
            SysOps · Homelab · DevOps
            github.com/50bvd

